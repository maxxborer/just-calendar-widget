name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build and test
        run: |
          xcodebuild \
            -project JustCalendarWidget.xcodeproj \
            -scheme JustCalendarWidget \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Capture native widget windows
        run: scripts/capture-screenshots.sh "$RUNNER_TEMP/widget-screenshots"
      - name: Upload real macOS screenshots
        uses: actions/upload-artifact@v7
        with:
          name: widget-screenshots
          path: ${{ runner.temp }}/widget-screenshots/*.png
          if-no-files-found: error
